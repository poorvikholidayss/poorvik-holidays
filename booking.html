<!DOCTYPE html>
<html>
<head>
<title>Poorvik Holidays Booking</title>
<style>
body{
font-family:Arial;
background:#08111f;
color:white;
padding:20px;
}

form{
max-width:500px;
margin:auto;
background:#10203a;
padding:25px;
border-radius:15px;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
background:#FFD700;
color:black;
padding:15px;
width:100%;
border:none;
border-radius:30px;
font-weight:bold;
font-size:16px;
}
</style>
</head>

<body>

<h1 align="center">Poorvik Holidays Booking</h1>

<form action="https://formsubmit.co/YOUR_EMAIL@gmail.com" method="POST">

<input type="text" name="Name" placeholder="Full Name" required>

<input type="tel" name="Phone" placeholder="Phone Number" required>

<input type="number" name="Seats" placeholder="Number of Seats" required>

<select name="Tour">
<option>Chikkamagaluru & Sakleshpur</option>
<option>Mantralayam</option>
<option>Custom Tour</option>
</select>

<textarea name="Message" placeholder="Additional Details"></textarea>

<button type="submit">
Book Now
</button>

</form>

</body>
</html>

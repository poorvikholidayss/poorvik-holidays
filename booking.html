<!DOCTYPE html>
<html>
<head>
<title>Poorvik Holidays Booking</title>
<style>
body{
font-family:Arial;
background:#08111f;
color:white;
padding:20px;
}

form{
max-width:500px;
margin:auto;
background:#10203a;
padding:25px;
border-radius:15px;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
background:#FFD700;
color:black;
padding:15px;
width:100%;
border:none;
border-radius:30px;
font-weight:bold;
font-size:16px;
}
</style>
</head>

<body>

<h1 align="center">Poorvik Holidays Booking</h1>

<form action="https://formsubmit.co/poorvikholidayss@gmail.com" method="POST">

<input type="text" name="Name" placeholder="Full Name" required>

<input type="tel" name="Phone" placeholder="Phone Number" required>

<label>Tour Type</label>
<select id="tourType" name="Tour Type" onchange="toggleState()" required>
<option value="">Select Tour Type</option>
<option value="Inside Karnataka">Inside Karnataka</option>
<option value="Outside Karnataka">Outside Karnataka</option>
</select>

<div id="stateBox" style="display:none;">
<label>Select State</label>
<select name="State">
<option value="">Select State</option>
<option>Andhra Pradesh</option>
<option>Maharashtra</option>
<option>Goa</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
</select>
</div>

<label>Destination / Places to Visit</label>
<textarea
name="Places"
placeholder="Example: Coorg, Ooty, Goa, Munnar, Tirupati..."
required>
</textarea>

<label>Number of Travellers</label>
<input
type="number"
name="Travellers"
placeholder="How many people are travelling?"
required>

<label>Travel Date</label>
<input
type="date"
name="Travel Date"
required>

<label>Additional Requirements</label>
<textarea
name="Message"
placeholder="Hotel, food, pickup location, special requests..."
></textarea>

<script>
function toggleState(){
var tourType=document.getElementById("tourType").value;

if(tourType=="Outside Karnataka"){
document.getElementById("stateBox").style.display="block";
}else{
document.getElementById("stateBox").style.display="none";
}
}
</script>
<select name="Tour">
<option>Chikkamagaluru & Sakleshpur</option>
<option>Mantralayam</option>
<option>Custom Tour</option>
</select>

<textarea name="Message" placeholder="Additional Details"></textarea>

<button type="submit">
Book Now
</button>

</form>

</body>
</html>

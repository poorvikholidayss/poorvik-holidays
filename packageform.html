<!DOCTYPE html>
<html>
<head>
<title>Chikkamagaluru & Sakleshpur Tour Booking</title>

<style>
body{
font-family:Arial,sans-serif;
background:#08111f;
color:white;
padding:20px;
}

h1{
text-align:center;
color:#FFD700;
}

form{
max-width:600px;
margin:auto;
background:#10203a;
padding:25px;
border-radius:15px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:8px;
}

button{
background:#FFD700;
color:black;
padding:15px;
width:100%;
border:none;
border-radius:30px;
font-weight:bold;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

button:hover{
opacity:.9;
}
</style>

</head>
<body>

<h1>🌄 Chikkamagaluru & Sakleshpur Adventure Tour</h1>

<form action="https://formsubmit.co/poorvikholidayss@gmail.com" method="POST">

<input type="hidden" name="_subject"
value="New Chikkamagaluru Tour Booking">

<input type="hidden" name="_next"
value="https://poorvikholidayss.github.io/poorvik-holidays/thankyou.html">

<input type="hidden" name="_captcha" value="false">

<label>Full Name</label>
<input type="text" name="Name" required>

<label>Phone Number</label>
<input type="tel" name="Phone" required>

<label>Number of Seats</label>
<select name="Seats" required>
<option value="">Select</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6+</option>
</select>

<label>Pickup Point</label>
<select name="Pickup Point" required>
<option value="">Select</option>
<option>Jalahalli Cross</option>
<option>Yeshwanthpur</option>
<option>Hebbal</option>
<option>Other</option>
</select>

<label>Emergency Contact Number</label>
<input type="tel" name="Emergency Contact">

<label>Special Requests</label>
<textarea
name="Special Requests"
placeholder="Food preferences, medical conditions, etc."></textarea>

<label>
<input type="checkbox" required style="width:auto;">
I confirm that the above information is correct.
</label>

<button type="submit">
🚐 Book My Seat
</button>

</form>

</body>
</html>
